name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: scripts lint and the priority probe passes offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: shellcheck the drivers
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x -S warning lib/hello-zenoh.sh bin/hello-zenoh patterns/*/run.sh

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: control-priority probe (local loopback only)
        working-directory: patterns/control-priority
        run: |
          python -m pip install --quiet eclipse-zenoh==1.9.0
          python test_probe.py
